<!doctype html>
<!-- play.html — static landing page for shared OpenMusic tracks (Pages).
     Docs: docs/share-deep-links.md §3. A share link reaches here as
     play.html?t=<id>&n=<title>&a=<artist>. The page immediately tries to
     hand the track to the app (Android: Chrome intent:// with the openmusic
     scheme; desktop: the openmusic:// scheme), and if the app is absent the
     fallback UI resolves the current release's installers straight from
     GitHub. Playback identity is the id — n/a are display hints only. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Open in OpenMusic</title>
<meta name="robots" content="noindex" />
<meta property="og:site_name" content="OpenMusic" />
<meta property="og:title" content="Open this track in OpenMusic" />
<meta property="og:description" content="A shared OpenMusic track. The app plays it — no app yet? The link offers the download." />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100svh; display: grid; place-items: center;
    background: radial-gradient(1200px 700px at 50% -20%, #241f38, #0b0a12 60%);
    color: #efecf6; font: 15px/1.5 system-ui, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
  }
  .card {
    width: min(460px, 100%); text-align: center;
    background: rgba(255,255,255,.045); border: 1px solid rgba(255,255,255,.09);
    border-radius: 22px; padding: 30px 26px 26px; backdrop-filter: blur(6px);
  }
  .mark {
    width: 74px; height: 74px; margin: 0 auto 14px; border-radius: 20px;
    background: #000; overflow: hidden; display: grid; place-items: center;
    box-shadow: 0 10px 30px rgba(0,0,0,.45);
  }
  .mark img { width: 100%; height: 100%; object-fit: cover; }
  .eyebrow { letter-spacing: .18em; text-transform: uppercase; font-size: 11px; color: #9b93b8; margin: 0 0 6px; }
  h1 { margin: 0 0 2px; font-size: 21px; line-height: 1.25; overflow-wrap: anywhere; }
  .sub { color: #b9b3cf; margin: 0 0 18px; overflow-wrap: anywhere; }
  .status { color: #8f88ab; font-size: 13px; margin: 14px 0 0; min-height: 20px; }
  .actions { display: grid; gap: 10px; margin-top: 16px; }
  a.btn, button.btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 12px 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,.12);
    background: rgba(255,255,255,.06); color: inherit; text-decoration: none;
    font: inherit; cursor: pointer;
  }
  a.btn.primary { background: #6d28d9; border-color: transparent; font-weight: 600; }
  a.btn.primary:hover { background: #7c3aed; }
  a.btn:hover, button.btn:hover { background: rgba(255,255,255,.12); }
  .hint { color: #8f88ab; font-size: 12.5px; margin: 14px 0 0; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<main class="card">
  <div class="mark"><img alt="OpenMusic logo" src="./app/src/logo.png" onerror="this.style.display='none'" /></div>
  <p class="eyebrow">Shared with OpenMusic</p>
  <h1 id="title">A shared track</h1>
  <p class="sub" id="sub"></p>
  <p class="status" id="status">Trying to open OpenMusic…</p>

  <div class="actions" id="get" hidden>
    <a class="btn primary" id="dl-detected" data-dl href="https://github.com/Rohithdgrr/OPEN-MUSIC/releases/latest">Get OpenMusic</a>
    <a class="btn" id="dl-android" data-dl href="https://github.com/Rohithdgrr/OPEN-MUSIC/releases/latest">Download for Android (APK)</a>
    <a class="btn" id="dl-windows" data-dl href="https://github.com/Rohithdgrr/OPEN-MUSIC/releases/latest">Download for Windows</a>
    <a class="btn" id="dl-linux" data-dl href="https://github.com/Rohithdgrr/OPEN-MUSIC/releases/latest">Download for Linux</a>
    <button class="btn" id="copy" type="button">Copy the track link</button>
  </div>
  <p class="hint" id="hint" hidden>Install, open OpenMusic, then this link again — it plays the track.</p>
</main>

<script>
(function () {
  "use strict";
  var q = new URLSearchParams(location.search);
  var id = (q.get("t") || "").trim();
  var title = (q.get("n") || "").trim();
  var artist = (q.get("a") || "").trim();

  var titleEl = document.getElementById("title");
  var subEl = document.getElementById("sub");
  var statusEl = document.getElementById("status");
  var getEl = document.getElementById("get");
  var hintEl = document.getElementById("hint");
  titleEl.textContent = title || "A shared track";
  if (artist) subEl.textContent = artist;
  else if (!id) subEl.textContent = "Install OpenMusic to search and play anything.";

  // When the app handles the scheme the page loses focus — that is the
  // signal we never reach the fallback in.
  var appOpened = false;
  function onHidden() { if (document.hidden) appOpened = true; }
  document.addEventListener("visibilitychange", onHidden);
  window.addEventListener("pagehide", function () { appOpened = true; });
  window.addEventListener("blur", function () { appOpened = true; }, { once: true });

  var ANDROID_PACKAGE = "com.openmusic.trancemusic";
  function pageUrl() {
    // Re-shareable, decode-free link for the fallback copy button.
    return location.href;
  }
  function uri() { return "openmusic://t/" + encodeURIComponent(id); }

  if (id) {
    if (/android/i.test(navigator.userAgent)) {
      // Chrome resolves intent:// against installed handlers and, on miss,
      // lands on S.browser_fallback_url — which is this very page: the
      // timers below then keep showing the download screen.
      var fb = encodeURIComponent(pageUrl());
      location.replace(
        "intent://t/" + encodeURIComponent(id) +
        "#Intent;scheme=openmusic;package=" + ANDROID_PACKAGE +
        ";S.browser_fallback_url=" + fb + ";end"
      );
    } else {
      var probe = document.createElement("a");
      probe.href = uri();
      probe.style.display = "none";
      document.body.appendChild(probe);
      probe.click();
      probe.remove();
    }
  } else {
    // Nothing to hand over: straight to the download screen — no reason to
    // wait out the launcher timer that prove-the-app path depends on.
    appOpened = true;
    showFallback("Get OpenMusic to play anything from a shared link.");
    resolveAssets();
  }

  function showFallback(reason) {
    if (statusEl) statusEl.textContent = reason;
    if (getEl) getEl.hidden = false;
    if (hintEl) hintEl.hidden = false;

    var isWin = /windows/i.test(navigator.userAgent);
    var isAnd = /android/i.test(navigator.userAgent);
    var isLinux = /linux/i.test(navigator.userAgent) && !isAnd;
    var det = document.getElementById("dl-detected");
    if (isAnd) {
      det.textContent = "Download OpenMusic for Android";
      det.href = document.getElementById("dl-android").href;
    } else if (isWin) {
      det.textContent = "Download OpenMusic for Windows";
      det.href = document.getElementById("dl-windows").href;
    } else if (isLinux) {
      det.textContent = "Download OpenMusic for Linux";
      det.href = document.getElementById("dl-linux").href;
    } else {
      det.parentNode.removeChild(det);
    }
  }

  // Resolve the current release's assets (same pattern index.html uses).
  function resolveAssets() {
    var repo = "Rohithdgrr/OPEN-MUSIC";
    var ctl = typeof AbortSignal !== "undefined" && AbortSignal.timeout ? AbortSignal.timeout(8000) : undefined;
    fetch("https://api.github.com/repos/" + repo + "/releases/latest", {
      headers: { Accept: "application/vnd.github+json" },
      signal: ctl,
    })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (rel) {
        if (!rel || !rel.assets) return;
        var pick = function (re) {
          for (var i = 0; i < rel.assets.length; i++) {
            if (re.test(rel.assets[i].name)) return rel.assets[i].browser_download_url;
          }
          return null;
        };
        var apply = function (idName, url) {
          if (url) document.getElementById(idName).href = url;
        };
        apply("dl-android", pick(/\.apk$/i));
        apply("dl-windows", pick(/x64-setup\.exe$/i) || pick(/\.msi$/i));
        apply("dl-linux", pick(/\.AppImage$/i) || pick(/\.deb$/i));
        var det = document.getElementById("dl-detected");
        if (det) {
          if (/android/i.test(navigator.userAgent)) det.href = document.getElementById("dl-android").href;
          else if (/windows/i.test(navigator.userAgent)) det.href = document.getElementById("dl-windows").href;
          else if (/linux/i.test(navigator.userAgent) && !/android/i.test(navigator.userAgent)) det.href = document.getElementById("dl-linux").href;
        }
      })
      .catch(function () { /* release buttons keep the releases/latest href */ });
  }

  setTimeout(function () {
    document.removeEventListener("visibilitychange", onHidden);
    if (appOpened) return;
    showFallback(id ? "Couldn't open the app — get OpenMusic below, then open this link again."
                    : "Get OpenMusic to play anything from a shared link.");
    resolveAssets();
  }, 3500);

  document.getElementById("copy").addEventListener("click", function () {
    var text = [title, artist].filter(Boolean).join(" — ");
    var payload = (text ? text + " · " : "") + pageUrl();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(payload).then(function () { ok(); }, ok);
    } else {
      var ta = document.createElement("textarea");
      ta.value = payload; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); } catch (er) {}
      ta.remove(); ok();
    }
    function ok() {
      var b = document.getElementById("copy");
      b.textContent = "Link copied ✓";
      setTimeout(function () { b.textContent = "Copy the track link"; }, 2000);
    }
  });
})();
</script>
</body>
</html>
