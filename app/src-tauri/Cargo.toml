[package]
name = "trance-music"
version = "0.2.0"
description = "TRANCE MUSIC — open-source music streaming player"
edition = "2021"
rust-version = "1.77"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
# Phase 1 backup/restore: native Save/Open dialogs, driven from Rust so no
# extra frontend capability entries are needed.
tauri-plugin-dialog = "2"
# Phase 2 Google Drive sync: OS-random PKCE verifiers / OAuth state.
getrandom = "0.2"
# Phase 2: the Drive refresh token lives in the OS credential store
# (Windows Credential Manager), never in a file or localStorage.
keyring = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
axum = "0.8"
url = "2"
futures = "0.3"
# JioSaavn encrypts `encrypted_media_url` with DES-ECB before base64.
des = "0.8"
base64 = "0.22"
# Cache layers L1/L2/L4-RAM: concurrent TTL + size-aware LRU (design §TL;DR 2).
moka = { version = "0.12", features = ["future"] }
# Vault ledger (review 4.5): WAL-mode SQLite, bundled so no system SQLite
# is required on user machines.
rusqlite = { version = "0.37", features = ["bundled"] }

# reqwest's default TLS (native-tls) drags openssl-sys in on Android, where
# there is no system OpenSSL to link against. Desktop keeps the default
# (schannel on Windows); Android rides rustls.
[target.'cfg(not(target_os = "android"))'.dependencies]
reqwest = { version = "0.12", features = ["json", "stream"] }

[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "charset", "http2"] }

[target.'cfg(windows)'.dependencies]
# The desktop card's "on the wallpaper" placement is a raw SetParent into the
# shell's WorkerW layer, which the Tauri window API does not expose.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

[dev-dependencies]
# Local mock server for the offline transport tests (review 5.1).
wiremock = "0.6"
