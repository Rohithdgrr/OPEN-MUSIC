[package]
name = "trance-music"
version = "0.1.0"
description = "TRANCE MUSIC — open-source music streaming player"
edition = "2021"
rust-version = "1.77"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
axum = "0.8"
reqwest = { version = "0.12", features = ["json", "stream"] }
url = "2"
futures = "0.3"
# JioSaavn encrypts `encrypted_media_url` with DES-ECB before base64.
des = "0.8"
base64 = "0.22"
# Vault ledger (review 4.5): WAL-mode SQLite, bundled so no system SQLite
# is required on user machines.
rusqlite = { version = "0.37", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
# The desktop card's "on the wallpaper" placement is a raw SetParent into the
# shell's WorkerW layer, which the Tauri window API does not expose.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

[dev-dependencies]
# Local mock server for the offline transport tests (review 5.1).
wiremock = "0.6"
