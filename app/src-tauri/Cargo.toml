[package]
name = "trance-music"
version = "0.4.0"
description = "TRANCE MUSIC — open-source music streaming player"
edition = "2021"
rust-version = "1.77"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# Phase 2 Google Drive sync: OS-random PKCE verifiers / OAuth state.
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
hex = "0.4"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
axum = { version = "0.8", features = ["ws"] }
# Listen Together room client (docs/listen-together.md §6): the guest side of
# the room protocol. Same crate axum's own `ws` feature uses server-side, so
# one copy of the tungstenite codec lands in the lockfile.
tokio-tungstenite = "0.26"
url = "2"
futures = "0.3"
# JioSaavn encrypts `encrypted_media_url` with DES-ECB before base64.
des = "0.8"
base64 = "0.22"
# URL encoding for OAuth and catalog APIs
urlencoding = "2"
# Catalog trait async trait support
async-trait = "0.1"
# Cache layers L1/L2/L4-RAM: concurrent TTL + size-aware LRU (design §TL;DR 2).
moka = { version = "0.12", features = ["future"] }
# Vault ledger (review 4.5): WAL-mode SQLite, bundled so no system SQLite
# is required on user machines.
rusqlite = { version = "0.37", features = ["bundled"] }
# Room QR symbol (app/src/qrview.js). Only the module matrix is needed — the
# frontend paints it to a canvas — so the default `image`/`svg`/`pic` encoders
# are switched off; they would drag the whole `image` crate into the build.
qrcode = { version = "0.14.1", default-features = false }

# Desktop-only plugins. None of them has a mobile implementation, and pulling
# them into the iOS/Android targets fails the mobile build, so they live here
# rather than in [dependencies].
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Global hotkeys + single-instance focus: desktop-only concepts, and pulling
# them into a mobile target fails the build.
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
# Signed in-app updates: pubkey + manifest endpoint live in tauri.conf.json.
tauri-plugin-updater = "2"
# Phase 1 backup/restore: native Save/Open dialogs, driven from Rust so no
# extra frontend capability entries are needed.
tauri-plugin-dialog = "2"
# Phase 2: the Drive refresh token lives in the OS credential store, never in
# a file or localStorage. keyring 3 ships NO default store: without the native
# feature for the running OS it silently falls back to the in-memory mock —
# sign-in "succeeds" but every later load reads NoEntry, so the status never
# leaves "Not signed in" (and Drive/Spotify import can never refresh).
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }

# reqwest's default TLS (native-tls) drags openssl-sys in on Android, where
# there is no system OpenSSL to link against. Desktop keeps the default
# (schannel on Windows); Android rides rustls.
[target.'cfg(not(target_os = "android"))'.dependencies]
reqwest = { version = "0.12", features = ["json", "stream"] }

[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "charset", "http2"] }

[target.'cfg(windows)'.dependencies]
# The desktop card's "on the wallpaper" placement is a raw SetParent into the
# shell's WorkerW layer, which the Tauri window API does not expose.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }
# The volume slider drives the Windows master volume, which means COM
# (IMMDeviceEnumerator / IAudioEndpointVolume) — windows-sys only exposes the
# raw ABI, so the `windows` crate's typed COM interfaces are used here.
windows = { version = "0.62", features = [
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Threading",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

[dev-dependencies]
rqrr = "0.10.1"
# Local mock server for the offline transport tests (review 5.1).
wiremock = "0.6"
