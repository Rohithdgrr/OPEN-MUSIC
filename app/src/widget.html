<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>OPEN MUSIC - desktop widget</title>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link href="styles.css" rel="stylesheet">
<style>
  /* The window is frameless and transparent: the rounded card below is all
     that should ever be painted, so the page itself contributes nothing. */
  html,
  body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }
  body {
    font-family: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    color: #f4f4f5;
  }
  ::-webkit-scrollbar {
    display: none;
  }
  button {
    font: inherit;
  }
</style>
<script>
  /* WebView2 HTTP-caches the custom protocol across rebuilds, and the asset
     URLs never change, so a rebuilt app kept executing yesterday's bytes.
     Stamping both URLs turns every launch into a cache miss. The link is
     re-stamped synchronously so the card is styled before first paint. */
  document.querySelector('link[href="styles.css"]').href = "styles.css?v=" + Date.now();
  addEventListener("DOMContentLoaded", () => {
    const s = document.createElement("script");
    s.type = "module";
    s.src = "/widget.js?v=" + Date.now();
    document.head.appendChild(s);
  });
</script>
</head>
<body>
<div class="tm-widget" id="wg-card">
  <div class="tm-widget__art" id="wg-art"></div>
  <div class="tm-widget__scrim"></div>
  <button class="tm-widget__mini" id="wg-mini" title="Expand player" type="button">
    <span class="material-symbols-outlined">graphic_eq</span>
  </button>
  <div class="tm-widget__inner">

    <header class="tm-widget__head" id="wg-head">
      <span class="tm-widget__logo"><span class="material-symbols-outlined">graphic_eq</span></span>
      <span class="tm-widget__brand">OPEN MUSIC<span class="tm-widget__tag">CORE V2.4</span></span>
      <span class="tm-widget__fmt"><i class="tm-widget__dot"></i><span id="wg-format">IDLE</span></span>
      <button class="tm-widget__btn" id="wg-pin" title="Pin: clicks pass through" type="button"><span class="material-symbols-outlined" id="wg-pinicon">keep_off</span></button>
      <button class="tm-widget__btn" id="wg-close" title="Turn the widget off" type="button"><span class="material-symbols-outlined">close</span></button>
    </header>

    <div class="tm-widget__np">
      <div class="tm-widget__cover">
        <span class="tm-widget__covericon material-symbols-outlined">graphic_eq</span>
        <img alt="" id="wg-cover">
        <span class="tm-widget__coverbadge" id="wg-badge">HQ</span>
      </div>
      <div class="tm-widget__meta">
        <div class="tm-widget__title" id="wg-title">Nothing playing</div>
        <div class="tm-widget__artist" id="wg-artist">Search the vault and press play</div>
      </div>
    </div>

    <div class="tm-widget__viz">
      <span class="tm-widget__vizlabel" id="wg-vizlabel">STANDBY</span>
      <span class="tm-widget__bars"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
    </div>

    <div class="tm-widget__track">
      <span class="tm-widget__time tm-nums" id="wg-cur">0:00</span>
      <div class="tm-widget__seek" id="wg-seek" title="Seek">
        <span class="tm-widget__fill" id="wg-fill"></span>
      </div>
      <span class="tm-widget__time tm-nums" id="wg-total">0:00</span>
    </div>

    <div class="tm-widget__transport">
      <div class="tm-widget__side">
        <button class="tm-widget__btn" id="wg-dl" title="Download this track" type="button"><span class="material-symbols-outlined">download</span></button>
        <button class="tm-widget__btn" id="wg-fav" title="Add to favorites" type="button"><span class="material-symbols-outlined" id="wg-favicon">favorite</span></button>
        <button class="tm-widget__btn" id="wg-prev" title="Previous" type="button"><span class="material-symbols-outlined">skip_previous</span></button>
      </div>
      <button class="tm-widget__btn tm-widget__play" id="wg-play" title="Play / pause" type="button"><span class="material-symbols-outlined" id="wg-playicon">play_arrow</span></button>
      <div class="tm-widget__side tm-widget__side--end">
        <button class="tm-widget__btn" id="wg-next" title="Next" type="button"><span class="material-symbols-outlined">skip_next</span></button>
        <button class="tm-widget__btn" id="wg-repeat" title="Repeat" type="button"><span class="material-symbols-outlined">repeat</span></button>
        <div class="tm-widget__vol">
          <button class="tm-widget__btn" id="wg-mute" title="Mute" type="button"><span class="material-symbols-outlined" id="wg-volicon">volume_up</span></button>
          <div class="tm-widget__voltrack" id="wg-voltrack" title="Volume">
            <div class="tm-widget__volrail"><span class="tm-widget__volfill" id="wg-volfill"></span></div>
          </div>
        </div>
      </div>
    </div>

    <div class="tm-widget__next" id="wg-nextup" title="Skip to the next track">
      <span class="tm-widget__nextcover"><img alt="" id="wg-nextcover"></span>
      <span class="tm-widget__nextmeta">
        <span class="tm-widget__nexttitle" id="wg-nexttitle">Nothing queued</span>
        <span class="tm-widget__nextsub" id="wg-nextsub">Add songs to the queue</span>
      </span>
      <span class="tm-widget__tag">NEXT</span>
    </div>

    <div class="tm-widget__foot">
      <span id="wg-place">ALWAYS ON TOP</span><span>/</span><span>DRAG THE HEADER</span><span>/</span><span id="wg-conn">CONNECTED</span>
    </div>

  </div>
</div>
</body>
</html>
