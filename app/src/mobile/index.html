<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="shell-type" content="mobile_tab">
<title>OpenMusic</title>
<!-- Fonts and shell styles are bundled locally so the shell still renders
     icons and text with zero connectivity (2026-10-24 offline-boot fix). -->

<link rel="stylesheet" href="/tailwind.css">
<link rel="stylesheet" href="shell.css">
<script src="tailwind-config.js"></script>

<script>
/* Mobile Theme Boot Engine — Evaluates tm-theme before first paint */
try {
  const t = localStorage.getItem("tm-theme") || "system";
  const isDark = t === "dark" || (t === "system" && window.matchMedia?.("(prefers-color-scheme: dark)").matches);
  if (isDark) document.documentElement.classList.add("dark");
} catch {}
</script>
</head>
<body class="bg-surface text-on-surface font-body-md text-body-md flex flex-col min-h-screen antialiased">
<div id="screen"></div>
<audio id="audio" preload="metadata"></audio>
<script src="router.js"></script>
<!-- jsQR: scan-to-join decoder (B-T2), classic script on purpose — see
     src/vendor/README.md. Module scripts are deferred, so this executes
     before app.js can ask for window.jsQR. -->
<script src="../vendor/jsQR.js"></script>
<script type="module" src="entry.js"></script>
</body>
</html>
