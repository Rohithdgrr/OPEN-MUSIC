<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="shell-type" content="mobile_tab">
<title>OPEN MUSIC</title>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&amp;family=JetBrains+Mono:wght@100..900&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link rel="stylesheet" href="/tailwind.css">
<script src="tailwind-config.js"></script>
<style>
@layer base {
  html, body {
    width: 100vw;
    margin: 0;
    padding: 0;
    background-color: #f9f9fb;
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }
  body {
    overscroll-behavior-y: none;
    min-height: max(884px, 100dvh);
    user-select: none;
    -webkit-user-select: none;
  }
  input, textarea {
    user-select: text;
    -webkit-user-select: text;
  }
  .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }
  .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
  main > :first-child { margin-top: 0 !important; }
  main > :last-child { margin-bottom: 0 !important; }
}

/* Screens' fixed headers carry .pt-safe, so <main>'s top offset must add the
   same status-bar inset — a bare pt-14/pt-16 left the first row (the search
   field) sitting under the header on devices with a cutout. */
main.pt-14 { padding-top: calc(3.5rem + env(safe-area-inset-top, 0px)); }
main.pt-16 { padding-top: calc(4rem + env(safe-area-inset-top, 0px)); }
::-webkit-scrollbar { display: none; }
* { -ms-overflow-style: none; scrollbar-width: none; }

/* Lyrics karaoke — port of the desktop's styles.css (mobile loads no
   styles.css, so the .lyric-* rules live here). JS toggles lyric-active /
   lyric-past and drives each word's fill through --progress. */
.lyric-line {
  border-left: 3px solid transparent;
  padding-left: 6px;
  border-radius: 4px;
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}
.lyric-word {
  background-image: linear-gradient(90deg, #18181b 0%, #18181b var(--progress, 0%), #71717a var(--progress, 0%), #71717a 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.lyric-text { transition: font-size 0.25s ease, font-weight 0.25s ease, color 0.25s ease; }
.lyric-active {
  border-left: 3px solid #18181b;
  background: rgba(24, 24, 27, 0.05);
}
.lyric-active .lyric-text { font-size: 16px; font-weight: 700; line-height: 1.45; color: #18181b; }
.lyric-past .lyric-text { font-size: 13px; color: #71717a; }
.lyric-past .lyric-word { background-image: linear-gradient(90deg, #71717a, #71717a); }
.lyric-line:not(.lyric-active):not(.lyric-past) .lyric-text { color: #52525b; }
.lyric-line:not(.lyric-active):not(.lyric-past) .lyric-word { background-image: linear-gradient(90deg, #52525b, #52525b); }

/* High contrast dark mode lyrics */
html.dark .lyric-active,
.dark .lyric-active {
  border-left: 3px solid #ffffff !important;
  background: rgba(255, 255, 255, 0.08) !important;
}
html.dark .lyric-active .lyric-text,
.dark .lyric-active .lyric-text {
  color: #ffffff !important;
  font-size: 16px;
  font-weight: 700;
}
html.dark .lyric-past .lyric-text,
.dark .lyric-past .lyric-text {
  color: #71717a !important;
}
html.dark .lyric-line:not(.lyric-active):not(.lyric-past) .lyric-text,
.dark .lyric-line:not(.lyric-active):not(.lyric-past) .lyric-text {
  color: #a1a1aa !important;
}
html.dark .lyric-word,
.dark .lyric-word {
  background-image: linear-gradient(90deg, #ffffff 0%, #ffffff var(--progress, 0%), #71717a var(--progress, 0%), #71717a 100%) !important;
}

/* Ensure circular buttons and pills are true circles/pills */
.rounded-full {
  border-radius: 9999px !important;
}

/* Smooth tab view transitions */
@keyframes tm-tab-fade {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}
.tab-content.flex {
  animation: tm-tab-fade 0.22s cubic-bezier(0.16, 1, 0.3, 1);
}

/* Lyrics full-view stage — true immersive fullscreen overlay */
.tm-lyrics-full {
  position: fixed !important;
  inset: 0 !important;
  z-index: 95 !important;
  margin: 0 !important;
  padding: calc(1rem + env(safe-area-inset-top, 0px)) 1.5rem calc(1.5rem + env(safe-area-inset-bottom, 0px)) 1.5rem !important;
  background: rgba(255, 255, 255, 0.98) !important;
  backdrop-filter: blur(32px) saturate(180%) !important;
  -webkit-backdrop-filter: blur(32px) saturate(180%) !important;
  border: none !important;
  border-radius: 0 !important;
  box-shadow: none !important;
  display: flex !important;
  flex-direction: column !important;
  overflow: hidden !important;
}
.tm-lyrics-full [data-lyrics] { flex: 1 1 auto; max-height: none !important; padding: 2rem 0; }
.tm-lyrics-full .lyric-text { font-size: 22px !important; line-height: 1.5 !important; }
.tm-lyrics-full .lyric-active .lyric-text { font-size: 28px !important; font-weight: 700 !important; line-height: 1.4 !important; }
.tm-lyrics-full .lyric-past .lyric-text { font-size: 18px !important; opacity: 0.55 !important; }

/* Toast stack — mobile's own; the desktop's #toast-stack lives in styles.css,
   which this shell never loads. Single toast at the bottom, click to dismiss. */
#tm-toast-stack {
  position: fixed;
  bottom: calc(env(safe-area-inset-bottom, 16px) + 5.5rem);
  left: 0;
  right: 0;
  z-index: 80;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.5rem;
  padding: 0 1rem;
  pointer-events: none;
}
.tm-toast {
  pointer-events: auto;
  display: flex;
  align-items: center;
  gap: 0.6rem;
  max-width: 90%;
  background: rgba(255, 255, 255, 0.96);
  backdrop-filter: blur(20px) saturate(160%);
  -webkit-backdrop-filter: blur(20px) saturate(160%);
  color: #18181b;
  border: 1px solid rgba(0, 0, 0, 0.08);
  border-radius: 9999px;
  padding: 0.6rem 1.15rem;
  font-size: 13px;
  font-weight: 500;
  line-height: 1.35;
  box-shadow: 0 12px 32px -4px rgba(0, 0, 0, 0.12), 0 4px 12px -2px rgba(0, 0, 0, 0.06);
  cursor: pointer;
  animation: tm-toast-in 0.28s cubic-bezier(0.16, 1, 0.3, 1);
  transition: transform 0.15s ease, opacity 0.15s ease;
}
.dark .tm-toast,
html.dark .tm-toast {
  background: rgba(24, 24, 27, 0.96);
  color: #f4f4f5;
  border-color: rgba(255, 255, 255, 0.14);
  box-shadow: 0 12px 36px -4px rgba(0, 0, 0, 0.5), 0 4px 12px -2px rgba(0, 0, 0, 0.3);
}
.tm-toast:active { transform: scale(0.97); }
.tm-toast .tm-dot {
  width: 0.5rem;
  height: 0.5rem;
  border-radius: 9999px;
  flex-shrink: 0;
  background: #71717a;
}
.tm-toast > span:not(.tm-dot) { min-width: 0; overflow-wrap: anywhere; font-weight: 500; }
.tm-toast-action {
  margin-left: 0.4rem;
  flex-shrink: 0;
  padding: 0.18rem 0.6rem;
  border-radius: 9999px;
  background: rgba(0, 0, 0, 0.08);
  color: #18181b;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.03em;
  text-transform: uppercase;
}
.dark .tm-toast-action,
html.dark .tm-toast-action {
  background: rgba(255, 255, 255, 0.15);
  color: #f4f4f5;
}
.tm-toast-action:active { opacity: 0.7; }
.tm-toast[data-kind="success"] .tm-dot { background: #16a34a; box-shadow: 0 0 10px rgba(22, 163, 74, 0.7); }
.tm-toast[data-kind="error"] .tm-dot { background: #dc2626; box-shadow: 0 0 10px rgba(220, 38, 38, 0.7); }
.tm-toast[data-kind="warning"] .tm-dot { background: #d97706; box-shadow: 0 0 10px rgba(217, 119, 6, 0.7); }
.tm-toast[data-kind="info"] .tm-dot { background: #4f46e5; box-shadow: 0 0 10px rgba(79, 70, 229, 0.7); }
.tm-toast.tm-out { opacity: 0; transform: translateY(-8px) scale(0.94); transition: opacity 0.2s, transform 0.2s; }
@keyframes tm-toast-in {
  from { opacity: 0; transform: translateY(-12px) scale(0.92); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

/* Skeleton Loading Shimmer — Spotify-style pulse and specular highlights */
@keyframes tm-shimmer {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(100%); }
}
.tm-skeleton {
  position: relative;
  overflow: hidden;
  background-color: rgba(228, 228, 231, 0.55);
}
.tm-skeleton::after {
  content: "";
  position: absolute;
  inset: 0;
  transform: translateX(-100%);
  background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.7) 50%, transparent 100%);
  animation: tm-shimmer 1.4s ease-in-out infinite;
}

/* Screen Transitions & Spring Micro-interactions */
#screen {
  animation: tm-screen-enter 0.22s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes tm-screen-enter {
  from { opacity: 0.9; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

button:active:not(:disabled), [role="button"]:active {
  transform: scale(0.96);
  transition: transform 0.1s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.tm-glow {
  box-shadow: 0 8px 24px -4px rgba(0, 0, 0, 0.12), 0 2px 8px -2px rgba(0, 0, 0, 0.06);
}

/* Micro Loading Spinner */
.tm-spinner {
  width: 20px;
  height: 20px;
  border: 2px solid rgba(0, 0, 0, 0.15);
  border-top-color: currentColor;
  border-radius: 9999px;
  animation: tm-spin 0.65s linear infinite;
}
@keyframes tm-spin {
  to { transform: rotate(360deg); }
}

/* Mini-player marquee — overflowing widget titles scroll in an 8s loop. */
@keyframes tm-marquee {
  0% { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}
.tm-marquee {
  display: inline-block;
  white-space: nowrap;
  overflow: visible;
  text-overflow: clip;
  animation: tm-marquee 8s linear infinite;
}

/* Full queue sheet — 85vh bottom sheet (NOT the 40vh track sheet). */
#tm-queue-sheet {
  position: fixed;
  inset: 0;
  z-index: 80;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
}
#tm-queue-sheet [data-q-panel] { max-height: 85vh; border-radius: 1.5rem; }
#tm-queue-sheet [data-q-list] { overscroll-behavior: contain; }

/* First-run onboarding overlay. */
#tm-onboard {
  position: fixed;
  inset: 0;
  z-index: 100;
  overflow-y: auto;
}

/* ==========================================================================
   ELEVATED MOBILE LIGHT THEME (Matching Desktop Pure White & Monochrome Depth)
   Micro-gradients, hairline borders, frosted translucent glass, and soft shadows
   ========================================================================== */

/* 1. App Background & Canvas */
html:not(.dark),
html:not(.dark) body {
  background-color: #ffffff !important;
  color: #1a1c1d;
}

html:not(.dark) main {
  background-color: #ffffff !important;
}

/* 2. Frosted Header & Elevated Tab Bar Chrome */
html:not(.dark) header {
  background: rgba(255, 255, 255, 0.92) !important;
  backdrop-filter: blur(20px) saturate(140%) !important;
  -webkit-backdrop-filter: blur(20px) saturate(140%) !important;
  border-bottom: 1px solid rgba(0, 0, 0, 0.06) !important;
  box-shadow: 0 1px 10px rgba(0, 0, 0, 0.02) !important;
}

html:not(.dark) nav.fixed.bottom-0 {
  background: rgba(255, 255, 255, 0.94) !important;
  backdrop-filter: blur(24px) saturate(150%) !important;
  -webkit-backdrop-filter: blur(24px) saturate(150%) !important;
  border-top: 1px solid rgba(0, 0, 0, 0.07) !important;
  box-shadow: 0 -4px 24px rgba(0, 0, 0, 0.04) !important;
}

html:not(.dark) nav.fixed.bottom-0 a[aria-current="page"] > div {
  background: linear-gradient(180deg, #18181b 0%, #000000 100%) !important;
  color: #ffffff !important;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.16) !important;
}

html:not(.dark) nav.fixed.bottom-0 a[aria-current="page"] > div span {
  color: #ffffff !important;
}

/* 3. Cards & Surfaces with Micro-Gradients & Crisp Hairline Borders */
html:not(.dark) .bg-surface-container-lowest,
html:not(.dark) [data-shelf] > div,
html:not(.dark) .rounded-2xl.border,
html:not(.dark) .rounded-xl.border {
  background: linear-gradient(180deg, #ffffff 0%, #fbfbfd 100%) !important;
  border-color: rgba(0, 0, 0, 0.07) !important;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03), inset 0 1px 0 rgba(255, 255, 255, 0.9) !important;
}

/* The Now Playing artwork (P35) is a media frame, not a list card: the rule
   above must not repaint it or its frame. The metadata now lives in its own
   card BELOW the art (`#np-meta`), which *does* want that rule. */
html:not(.dark) #np-art-card {
  background: #1b1b1e !important;
  border-color: rgba(0, 0, 0, 0.08) !important;
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.14), 0 2px 8px rgba(0, 0, 0, 0.06) !important;
}

/* 4. Interactive List Rows (Playlists, Albums, Tracklists, History) */
html:not(.dark) .divide-y > div:hover,
html:not(.dark) [data-track-row]:hover,
html:not(.dark) .recent-pill:hover,
html:not(.dark) .genre-card:hover {
  background: linear-gradient(90deg, rgba(0, 0, 0, 0.015) 0%, rgba(0, 0, 0, 0.038) 40%, rgba(0, 0, 0, 0.015) 100%) !important;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}

html:not(.dark) .genre-card {
  border: 1px solid rgba(0, 0, 0, 0.07);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
}

html:not(.dark) .genre-card:active {
  transform: scale(0.97) !important;
}

/* 5. Buttons: High-Contrast Obsidian & Surface Gradients */
html:not(.dark) button.bg-primary,
html:not(.dark) .bg-primary:not(span) {
  background: linear-gradient(180deg, #18181b 0%, #09090b 100%) !important;
  color: #ffffff !important;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.2) !important;
  border: 1px solid #000000 !important;
}

html:not(.dark) button.bg-primary:hover,
html:not(.dark) .bg-primary:hover:not(span) {
  background: linear-gradient(180deg, #27272a 0%, #18181b 100%) !important;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.22) !important;
}

html:not(.dark) button.bg-surface-container-low,
html:not(.dark) button.bg-surface-container,
html:not(.dark) .bg-surface-container-low {
  background: linear-gradient(180deg, #ffffff 0%, #f4f4f6 100%) !important;
  border-color: rgba(0, 0, 0, 0.08) !important;
}

/* Filter Chips in Light Mode */
html:not(.dark) .filter-chip,
html:not(.dark) .home-cat-chip {
  transition: all 0.16s cubic-bezier(0.16, 1, 0.3, 1) !important;
}

html:not(.dark) .filter-chip.bg-primary,
html:not(.dark) .home-cat-chip.bg-primary {
  background: linear-gradient(180deg, #18181b 0%, #000000 100%) !important;
  color: #ffffff !important;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.18) !important;
  border: none !important;
}

html:not(.dark) .filter-chip:not(.bg-primary),
html:not(.dark) .home-cat-chip:not(.bg-primary) {
  background: linear-gradient(180deg, #ffffff 0%, #f5f5f7 100%) !important;
  border: 1px solid rgba(0, 0, 0, 0.08) !important;
  color: #47464b !important;
}

/* 6. Form Inputs & Search Bays */
html:not(.dark) input[type="text"],
html:not(.dark) input[type="search"],
html:not(.dark) input[type="password"],
html:not(.dark) select {
  background: #ffffff !important;
  border: 1px solid rgba(0, 0, 0, 0.1) !important;
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.02) !important;
  transition: all 0.2s ease;
}

html:not(.dark) input[type="text"]:focus,
html:not(.dark) input[type="search"]:focus,
html:not(.dark) input[type="password"]:focus,
html:not(.dark) select:focus {
  border-color: #000000 !important;
  box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.06) !important;
}

/* The search bay carries its own pill chrome (container border +
   focus-within ring); the global inset input border above would double it
   into a sharp inner rectangle. The input itself stays chromeless. */
html:not(.dark) #search-input,
html:not(.dark) #search-input:focus {
  background: transparent !important;
  border: 0 !important;
  box-shadow: none !important;
  outline: none !important;
}

/* 7. Image and Artwork Depth */
html:not(.dark) .aspect-square img,
html:not(.dark) [data-shelf] img,
html:not(.dark) .w-52 img,
html:not(.dark) .w-56 img {
  border: 1px solid rgba(0, 0, 0, 0.06);
  transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
}

/* 8. Scrubber Track & Sliders */
html:not(.dark) #scrubber-container #scrubber-bar {
  background: linear-gradient(90deg, #18181b 0%, #000000 100%) !important;
}

html:not(.dark) #scrubber-needle {
  background: #000000 !important;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.28) !important;
}

/* ==========================================================================
   GLOBAL MOBILE DARK THEME ENGINE (.dark & [data-theme="dark"])
   Complete high-fidelity obsidian palette (#09090b / #121215), elevated
   surface containers (#16161a / #202025), crisp white typography (#ffffff),
   silver secondary metadata (#a1a1aa / #71717a), and luminous accents.
   ========================================================================== */

html.dark,
body.dark,
.dark {
  color-scheme: dark !important;
  --color-primary: #ffffff !important;
  --color-on-primary: #000000 !important;
  --color-surface: #09090b !important;
  --color-on-surface: #ffffff !important;
  --color-on-surface-variant: #a1a1aa !important;
  --color-surface-container: #18181c !important;
  --color-surface-container-high: #222228 !important;
  --color-surface-container-highest: #2a2a32 !important;
  --color-surface-container-low: #141417 !important;
  --color-surface-container-lowest: #101013 !important;
  --color-secondary: #a1a1aa !important;
  --tm-text: #ffffff !important;
  --tm-muted: #a1a1aa !important;
}

html.dark,
html.dark body,
body.dark {
  background-color: #09090b !important;
  color: #f4f4f5 !important;
}

.dark main {
  background-color: #09090b !important;
}

/* Background Utility Inversions */
.dark .bg-surface,
html.dark .bg-surface {
  background-color: #09090b !important;
}

.dark .bg-surface-container,
html.dark .bg-surface-container {
  background-color: #18181c !important;
}

.dark .bg-surface-container-low,
html.dark .bg-surface-container-low {
  background-color: #141417 !important;
}

.dark .bg-surface-container-lowest,
html.dark .bg-surface-container-lowest {
  background-color: #101013 !important;
}

.dark .bg-surface-container-high,
html.dark .bg-surface-container-high {
  background-color: #222228 !important;
}

.dark .bg-surface-container-highest,
html.dark .bg-surface-container-highest {
  background-color: #2a2a32 !important;
}

.dark .bg-surface\/85,
html.dark .bg-surface\/85 {
  background-color: rgba(9, 9, 11, 0.88) !important;
}

.dark .bg-surface\/90,
html.dark .bg-surface\/90 {
  background-color: rgba(9, 9, 11, 0.94) !important;
}

/* Header & Bottom Navigation Bar with Deep Frosted Glass */
.dark header,
html.dark header {
  background-color: rgba(9, 9, 11, 0.9) !important;
  backdrop-filter: blur(24px) saturate(160%) !important;
  -webkit-backdrop-filter: blur(24px) saturate(160%) !important;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
  box-shadow: 0 4px 24px rgba(0, 0, 0, 0.6) !important;
}

.dark nav.fixed.bottom-0,
html.dark nav.fixed.bottom-0 {
  background-color: rgba(12, 12, 16, 0.96) !important;
  backdrop-filter: blur(24px) saturate(160%) !important;
  -webkit-backdrop-filter: blur(24px) saturate(160%) !important;
  border-top: 1px solid rgba(255, 255, 255, 0.09) !important;
  box-shadow: 0 -4px 28px rgba(0, 0, 0, 0.7) !important;
}

.dark nav.fixed.bottom-0 a[aria-current="page"] > div,
html.dark nav.fixed.bottom-0 a[aria-current="page"] > div {
  background: #ffffff !important;
  color: #000000 !important;
  box-shadow: 0 2px 12px rgba(255, 255, 255, 0.28) !important;
}

.dark nav.fixed.bottom-0 a[aria-current="page"] > div span,
html.dark nav.fixed.bottom-0 a[aria-current="page"] > div span {
  color: #000000 !important;
}

.dark nav.fixed.bottom-0 a:not([aria-current="page"]) span,
html.dark nav.fixed.bottom-0 a:not([aria-current="page"]) span {
  color: #a1a1aa !important;
}

.dark nav.fixed.bottom-0 a:not([aria-current="page"]):hover span,
html.dark nav.fixed.bottom-0 a:not([aria-current="page"]):hover span {
  color: #ffffff !important;
}

/* Typography & Headings in Dark Mode */
.dark .text-on-surface,
html.dark .text-on-surface {
  color: #ffffff !important;
}

.dark .text-on-surface-variant,
html.dark .text-on-surface-variant {
  color: #a1a1aa !important;
}

.dark .text-secondary,
html.dark .text-secondary {
  color: #a1a1aa !important;
}

.dark .text-zinc-400,
.dark .text-zinc-500,
.dark .text-neutral-400,
.dark .text-neutral-500,
html.dark .text-zinc-400,

/* Mobile Theme Boot Engine — Evaluates tm-theme before first paint */

} catch {}
