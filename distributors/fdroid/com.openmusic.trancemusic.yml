AutoName: OpenMusic
Summary: Bit-perfect streaming music player with offline vault
Description: |-
  OpenMusic streams music through a local on-device relay, keeps an
  offline vault, shows synced lyrics and can play in sync with nearby
  devices over LAN Jam rooms. No account needed; updates are signed.

  Streams come from third-party catalog services, so a network connection
  is needed for anything not saved to the vault.

# Streams resolve against proprietary catalog APIs.
AntiFeatures:
  - NonFreeNet

# F-Droid signs with its own key: F-Droid installs can't update GitHub-APK
# installs in place (uninstall first). versionCode must keep rising with
# each release — after bumping `version`, confirm `tauri.properties`
# advanced it (5001 for 0.5.1); set it explicitly if it didn't.

RepoType: git
Repo: https://github.com/Rohithdgrr/OPEN-MUSIC

Builds:
  - versionName: 0.5.1
    versionCode: 5001
    commit: v0.5.1
    # NOTE: the gradle project (gen/android) is generated, not committed.
    # Verified 2026-10-14: `tauri android init --ci` runs non-interactively,
    # so the server can generate it. Node.js arrives via apt below; the Rust
    # Android targets ride the project's rust-toolchain pin through rustup.
    # Untested on F-Droid infra — their CI on the MR is the first real proof.
    subdir: app/src-tauri/gen/android
    sudo:
      - apt-get update
      - apt-get install -y nodejs npm
    prebuild:
      - cd app && npm ci --no-audit --no-fund && npx tauri android init --ci
    gradle:
      - yes

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 0.5.1
CurrentVersionCode: 5001
