name: Upstream API contracts

on:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check public API contracts
        id: contract
        continue-on-error: true
        run: node app/scripts/check-upstream-contracts.mjs
      - name: Update the managed incident issue
        if: always()
        uses: actions/github-script@v7
        env:
          CHECK_OUTCOME: ${{ steps.contract.outcome }}
          CHECKS: ${{ steps.contract.outputs.checks }}
        with:
          script: |
            const title = "[Automated] Upstream API contract failure";
            const marker = "<!-- generated-by: upstream-api-contracts -->";
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const issue = issues.find((item) =>
              !item.pull_request && item.title === title && item.body?.includes(marker)
            );
            if (process.env.CHECK_OUTCOME !== "success") {
              const details = process.env.CHECKS || "The checker did not produce results.";
              const body = `${marker}\n\nThe scheduled public API contract check failed.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n\`\`\`json\n${details}\n\`\`\`\n\nThis issue is maintained by \`.github/workflows/api-contracts.yml\`.`;
              if (issue) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body,
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                });
              }
            } else if (issue) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
                state_reason: "completed",
              });
            }
      - name: Mark the scheduled check failed
        if: steps.contract.outcome == 'failure'
        run: exit 1
