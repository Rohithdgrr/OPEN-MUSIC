name: Release

# Tag-driven release: build the installers on Windows, Linux and macOS in
# parallel, let `tauri build` sign the updater packages with the keypair in
# secrets, then merge the three jobs' outputs into one latest.json (the
# manifest every platform's updater reads) and attach everything to the tag's
# GitHub release.
#
# Secrets to configure once (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY          — contents of the private key file
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD — empty (the key has no password)
#
# The installers get the updater signature above. Authenticode / SmartScreen
# signing additionally needs the certificate imported on the runner — the
# config's certificateThumbprint is nulled out here so the build skips it
# until that is set up.

on:
  push:
    tags: ["v*", "V*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: msi,nsis
            artifact: windows
          - os: ubuntu-latest
            bundles: deb,appimage
            artifact: linux
          - os: macos-latest
            bundles: app,dmg
            artifact: macos
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install Linux system deps (webkitgtk, appindicator)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf
      - name: Install frontend deps
        run: npm ci
      - name: Build installers (updater signature)
        run: npx tauri build --bundles ${{ matrix.bundles }} --config '{"bundle":{"windows":{"certificateThumbprint":null,"timestampUrl":null}}}'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Optional: repo secret GOOGLE_CLIENT_ID bakes Drive sync into the
          # build. Absent = the app compiles and runs unconfigured.
          TRANCE_MUSIC_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.artifact }}
          path: app/src-tauri/target/release/bundle
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Assemble manifests and publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Download every OS's bundle
        uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          path: app/src-tauri/target/release/bundle
      - name: Assemble latest.json + update.json
        # The script lives under app/ — the publish job runs from the repo
        # root, so the path must include it (this wrong path is what failed
        # the v0.3.0 run). continue-on-error: an unsigned build (no
        # TAURI_SIGNING_PRIVATE_KEY) still ships installers; the updater
        # manifest step below is optional for exactly that case.
        continue-on-error: true
        run: node app/scripts/make-update-json.mjs ${{ github.ref_name }} app/src-tauri/target/release/bundle
      - name: Publish installers
        uses: softprops/action-gh-release@v2
        with:
          name: TRANCE MUSIC ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            app/src-tauri/target/release/bundle/**/*.msi
            app/src-tauri/target/release/bundle/**/*.exe
            app/src-tauri/target/release/bundle/**/*.deb
            app/src-tauri/target/release/bundle/**/*.AppImage
            app/src-tauri/target/release/bundle/**/*.dmg
      - name: Publish updater artifacts
        # Optional by nature: .zip/.sig naming changed across Tauri versions
        # and the sigs only exist when the build was signed. Includes
        # .app.tar.gz because the manifest points at it.
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: |
            app/src-tauri/target/release/bundle/**/*.msi.zip
            app/src-tauri/target/release/bundle/**/*.msi.zip.sig
            app/src-tauri/target/release/bundle/**/*.nsis.zip
            app/src-tauri/target/release/bundle/**/*.nsis.zip.sig
            app/src-tauri/target/release/bundle/**/*.exe.sig
            app/src-tauri/target/release/bundle/**/*.AppImage.tar.gz
            app/src-tauri/target/release/bundle/**/*.AppImage.tar.gz.sig
            app/src-tauri/target/release/bundle/**/*.app.tar.gz
            app/src-tauri/target/release/bundle/**/*.app.tar.gz.sig
      - name: Verify manifest URLs resolve
        # Runs after every binary is live: GitHub rewrites asset names
        # (spaces -> dots) and a wrong name only surfaces as a 404 when the
        # app tries to update. Fail here, before attaching the manifests.
        run: node app/scripts/verify-update-json.mjs app/src-tauri/target/release/bundle/latest.json
      - name: Publish manifests
        # Attached last so a manifest whose URLs do not resolve never ships.
        # Unmatched is fine: unsigned builds produce no manifests.
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: |
            app/src-tauri/target/release/bundle/latest.json
            app/src-tauri/target/release/bundle/update.json
