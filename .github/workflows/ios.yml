name: iOS

# iOS can only be compiled by Apple tooling: Xcode + the iOS SDK exist on
# macOS alone, so `tauri ios build` cannot run on Windows or Linux at all.
# This job therefore runs on a macOS runner and produces the archive GitHub
# stores as an artifact.
#
# What it produces depends on which secrets are configured:
#   * TAURI_APPLE_CERTIFICATE + TAURI_APPLE_CERTIFICATE_PASSWORD
#     + APPLE_PROVISIONING_PROFILE + APPLE_TEAM_ID  -> a signed .ipa
#   * none of those                                    -> a simulator build
#     (.app, unsigned, installable on a simulator or your own device via
#     Xcode). In-app updates do not apply to iOS — the App Store handles that.
#
# Manual run: Actions -> iOS -> Run workflow. Desktop releases never build
# iOS — tag pushes deliberately do NOT trigger this workflow; re-run it by
# hand when a simulator build is wanted.

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  ios:
    name: Build iOS
    runs-on: macos-14
    env:
      APPLE_CERTIFICATE: ${{ secrets.TAURI_APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.TAURI_APPLE_CERTIFICATE_PASSWORD }}
      APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Don't hardcode a version: the runner image decides which
          # /Applications/Xcode*.app exists, and a missing path fails the job.
          XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE" ]; then
            sudo xcode-select -s "$XCODE"
          fi
          xcodebuild -version
          xcode-select -p

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend deps
        working-directory: app
        run: npm ci

      - name: Build stylesheet
        working-directory: app
        run: npm run css

      - name: Rust targets for iOS
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios

      - name: Import signing material (when configured)
        if: env.APPLE_CERTIFICATE != ''
        run: |
          security create-keychain -p actions -s ios-signing
          security default-keychain -s ios-signing
          security unlock-keychain -p actions ios-signing
          echo "$APPLE_CERTIFICATE" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 -k ios-signing \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T apple
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k actions ios-signing
          mkdir -p "$RUNNER_TEMP/mobile"
          echo "$APPLE_PROVISIONING_PROFILE" | base64 --decode \
            > "$RUNNER_TEMP/mobile/embedded.mobileprovision"

      - name: Generate the Xcode project
        working-directory: app
        run: npx tauri ios init --ci

      - name: Signed device build (.ipa)
        if: env.APPLE_CERTIFICATE != '' && env.APPLE_PROVISIONING_PROFILE != ''
        working-directory: app
        run: |
          export APPLE_SIGNING_IDENTITY="Developer: ${APPLE_TEAM_ID}"
          npx tauri ios build --ipa

      - name: Simulator build (.app, unsigned)
        if: env.APPLE_CERTIFICATE == ''
        working-directory: app
        run: |
          set -o pipefail
          # Unsigned CI build via the CLI's official flags (added in
          # tauri-cli 2.11, PR #15061): `--no-sign` archives without a
          # development team and pulls the .app out of the .xcarchive, so no
          # exportArchive step runs ("No Team Found" was the old failure).
          # `--target aarch64-sim` selects the simulator SDK. The CLI takes
          # its own short names — [aarch64, aarch64-sim, x86_64] — NOT the
          # Rust triple `aarch64-apple-ios-sim`, which clap rejects as an
          # invalid value. (There is no `--simulator` flag either; it errors
          # as an unexpected argument.)
          # The CLI must stay the driver: the project has a build phase that
          # reads .tauri/cli-options-server.json, live only while it runs.
          npx tauri ios build --ci --verbose --no-sign --target aarch64-sim 2>&1 | tee ios-build.log

      - name: Report the failure where it can be read
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          # Artifacts and job logs both need an authenticated API call to read
          # back; an issue comment is public, so paste the tail there. Written
          # with curl + the token rather than `gh` so a missing/failed CLI can
          # never silently swallow the report.
          {
            echo "### iOS build failure (\`${TAG}\`)"
            echo
            echo '```'
            tail -n 120 app/ios-build.log 2>/dev/null || echo "no build log was produced"
            echo '```'
          } > /tmp/report.md
          python3 - <<'PY'
          import json, os, urllib.request
          repo = os.environ["REPO"]; tok = os.environ["GH_TOKEN"]
          body = open("/tmp/report.md", encoding="utf-8").read()
          api = f"https://api.github.com/repos/{repo}/issues"
          req = urllib.request.Request(api, headers={
            "Authorization": f"Bearer {tok}",
            "Accept": "application/vnd.github+json",
            "User-Agent": "trance-ci"})
          issues = json.load(urllib.request.urlopen(req))
          num = next((i["number"] for i in issues
                      if i["title"] == "iOS build log" and "pull_request" not in i), 0)
          if not num:
            data = json.dumps({"title": "iOS build log",
                              "body": "Automated iOS build reports land here."}).encode()
            r = urllib.request.Request(api, data=data, method="POST", headers={
              "Authorization": f"Bearer {tok}",
              "Accept": "application/vnd.github+json",
              "User-Agent": "trance-ci"})
            num = json.load(urllib.request.urlopen(r))["number"]
          c = urllib.request.Request(f"{api}/{num}/comments",
            data=json.dumps({"body": body}).encode(), method="POST", headers={
              "Authorization": f"Bearer {tok}",
              "Accept": "application/vnd.github+json",
              "User-Agent": "trance-ci"})
          urllib.request.urlopen(c)
          print(f"reported to issue #{num}")
          PY

      - name: Upload the iOS archive
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: |
            app/src-tauri/gen/apple/build/**/*.ipa
            app/src-tauri/gen/apple/build/**/*.app
            app/src-tauri/gen/apple/build/**/*.xcarchive
          if-no-files-found: error
          retention-days: 14