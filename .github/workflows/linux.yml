name: Linux Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: app/target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Install frontend dependencies
        working-directory: ./app
        run: npm ci

      - name: Build CSS
        working-directory: ./app
        run: npm run css

      - name: Run Rust tests
        working-directory: ./app/src-tauri
        run: cargo test --release
        env:
          # Same policy as ci.yml's "Cargo Unit Tests": the 17 `OP_OFFLINE`
          # -gated tests reach the live JioSaavn upstream, which serves
          # degraded answers to GitHub's shared runner IPs (empty radio
          # stations, missing Home-feed rows). They still run locally.
          OP_OFFLINE: "1"

      - name: Run Node.js tests
        working-directory: ./app
        run: npm test

      - name: Build Tauri app
        working-directory: ./app
        # `cargo tauri` needs `cargo-tauri` on PATH, which is not installed —
        # the CLI is the @tauri-apps/cli devDependency, so drive it with npx
        # the way release.yml does.
        # Annotations are public; job logs need admin (403). Surface the tail
        # as an annotation so a future failure is diagnosable at all.
        run: |
          if npx tauri build 2>&1 | tee /tmp/tauri-build.log; then
            echo "✓ tauri build succeeded"
          else
            echo "✗ tauri build failed"
            echo "::error title=tauri build (Linux)::$(tail -c 1500 /tmp/tauri-build.log | tr '\n' ' ')"
            exit 1
          fi
        env:
          # Tauri v2 reads only these names; the v1 TAURI_PRIVATE_KEY /
          # TAURI_KEY_PASSWORD are silently ignored and, with
          # bundle.createUpdaterArtifacts: true, the build fails at bundling.
          # Corrected to match release.yml.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Verify build artifacts
        run: |
          # `[ -f ".../*.deb" ]` never matches: test -f does not glob a quoted
          # pattern, so the literal * was tested and this always exited 1.
          # Resolve the glob into a variable first.
          DEB=$(ls app/src-tauri/target/release/bundle/deb/*.deb 2>/dev/null | head -1)
          if [ -n "$DEB" ]; then
            echo "✓ Debian package built successfully: $DEB"
            ls -lh app/src-tauri/target/release/bundle/deb/
          else
            echo "✗ Debian package not found"
            exit 1
          fi

          APPIMAGE=$(ls app/src-tauri/target/release/bundle/appimage/*.AppImage 2>/dev/null | head -1)
          if [ -n "$APPIMAGE" ]; then
            echo "✓ AppImage built successfully: $APPIMAGE"
            ls -lh app/src-tauri/target/release/bundle/appimage/
          else
            echo "✗ AppImage not found"
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build-artifacts
          path: |
            app/src-tauri/target/release/bundle/deb/*.deb
            app/src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 7

      - name: Smoke test - Verify binary execution
        run: |
          # Test AppImage
          APPIMAGE=$(find app/src-tauri/target/release/bundle/appimage -name "*.AppImage" | head -n1)
          chmod +x "$APPIMAGE"
          "$APPIMAGE" --version || echo "Version check not supported, this is expected"

          # Test deb package installation (dry run)
          DEB=$(find app/src-tauri/target/release/bundle/deb -name "*.deb" | head -n1)
          dpkg-deb -I "$DEB" > /dev/null
          echo "✓ Debian package is valid"

      - name: Run smoke tests
        working-directory: ./app
        # Run #15 failed here with no annotation, so the cause had to be
        # inferred from the step name. Emit the tail so it is self-reporting.
        run: |
          if npm run test:smoke 2>&1 | tee /tmp/smoke.log; then
            echo "✓ smoke tests passed"
          else
            echo "✗ smoke tests failed"
            echo "::error title=smoke tests (Linux)::$(tail -c 1200 /tmp/smoke.log | tr '\n' ' ')"
            exit 1
          fi

      - name: Create build summary
        run: |
          echo "## Linux Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Build completed successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -lh app/src-tauri/target/release/bundle/deb/
          ls -lh app/src-tauri/target/release/bundle/appimage/
          echo '```' >> $GITHUB_STEP_SUMMARY
