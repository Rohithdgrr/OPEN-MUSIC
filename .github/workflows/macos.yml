name: macOS Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          # Node 20's `--test` does not expand the `tests/**/*.test.mjs`
          # glob `npm test` passes, so the runner reported
          # "Could not find .../tests/**/*.test.mjs" and exited 1. Every other
          # workflow already pins 22.
          node-version: '22'

      - name: Install system dependencies
        run: |
          brew install openssl@3

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: app/target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Install frontend dependencies
        working-directory: ./app
        run: npm ci

      - name: Build CSS
        working-directory: ./app
        run: npm run css

      - name: Run Rust tests
        working-directory: ./app/src-tauri
        run: cargo test --release
        env:
          # Same policy as ci.yml's "Cargo Unit Tests": the 17 `OP_OFFLINE`
          # -gated tests reach the live JioSaavn upstream, which serves
          # degraded answers to GitHub's shared runner IPs (empty radio
          # stations, missing Home-feed rows). They still run locally.
          OP_OFFLINE: "1"

      - name: Run Node.js tests
        working-directory: ./app
        run: npm test

      - name: Build Tauri app
        working-directory: ./app
        # `cargo tauri` needs `cargo-tauri` on PATH, which is not installed —
        # the CLI is the @tauri-apps/cli devDependency, so drive it with npx
        # the way release.yml does.
        #
        # Two traps handled here:
        # 1. An unset GitHub secret expands to "" and is EXPORTED as set-but-
        #    empty. Rust's env::var returns Ok(""), so Tauri concludes signing
        #    is configured and fails importing a certificate that isn't there.
        #    Unset any APPLE_* var that came through empty.
        # 2. Job logs need admin (403) on this repo, so the real error is
        #    unreadable. Annotations ARE public — emit the log tail as one,
        #    otherwise a failure here is permanently undiagnosable.
        # 3. pipefail is mandatory — `npx tauri build | tee` without it returns
        #    tee's 0, so the if/else would report success on any failure and
        #    the annotation would never fire. Caught after the same wrapper
        #    masked a real Linux failure in run #16.
        run: |
          set -o pipefail
          for v in APPLE_SIGNING_IDENTITY APPLE_CERTIFICATE \
                   APPLE_CERTIFICATE_PASSWORD APPLE_PROVISIONING_PROFILE \
                   TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [ -z "${!v:-}" ]; then
              unset "$v"
              echo "(unset empty: $v)"
            fi
          done

          if npx tauri build 2>&1 | tee /tmp/tauri-build.log; then
            echo "✓ tauri build succeeded"
          else
            echo "✗ tauri build failed"
            echo "::error title=tauri build (macOS)::$(tail -c 1500 /tmp/tauri-build.log | tr '\n' ' ')"
            exit 1
          fi
        env:
          # Tauri v2 reads only these two names. The v1-era
          # TAURI_PRIVATE_KEY / TAURI_KEY_PASSWORD are silently ignored, and
          # tauri.conf.json sets bundle.createUpdaterArtifacts: true, which
          # makes the key mandatory — wrong names = build fails at bundling
          # while the vars look set. Matches release.yml.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}

      - name: Verify build artifacts
        # An .app bundle is a DIRECTORY. The old `[ -f "...OPEN MUSIC.app" ]`
        # was always false and exited 1 — latent until the build started
        # succeeding, because every earlier run died at "Build Tauri app".
        # -e so the check passes for a directory and a file alike.
        run: |
          set -uo pipefail
          VERIFY_LOG=/tmp/verify.log
          {
          if [ -d "app/src-tauri/target/release/bundle/macos" ]; then
            echo "✓ macOS bundle directory exists"
            ls -lh app/src-tauri/target/release/bundle/macos/
          else
            echo "✗ macOS bundle directory not found"
            exit 1
          fi

          # Glob must be resolved into a variable first: `test -f` does not
          # expand a quoted pattern, so the old literal `*.dmg` test was
          # always false and reported "DMG not found" even on success.
          DMG=$(ls app/src-tauri/target/release/bundle/dmg/*.dmg 2>/dev/null | head -1)
          if [ -n "$DMG" ]; then
            echo "✓ DMG built successfully: $DMG"
            ls -lh app/src-tauri/target/release/bundle/dmg/
          else
            echo "⚠ DMG not found (may require code signing)"
          fi

          if [ -e "app/src-tauri/target/release/bundle/macos/OPEN MUSIC.app" ]; then
            echo "✓ .app bundle built successfully"
            ls -la "app/src-tauri/target/release/bundle/macos/OPEN MUSIC.app/"
          else
            echo "✗ .app bundle not found"
            exit 1
          fi
          } 2>&1 | tee "$VERIFY_LOG"
          RC=${PIPESTATUS[0]}
          if [ "$RC" -ne 0 ]; then
            echo "::error title=Verify build artifacts (macOS)::$(tail -c 1200 "$VERIFY_LOG" | tr '\n' ' ')"
          fi
          exit "$RC"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-build-artifacts
          path: |
            app/src-tauri/target/release/bundle/dmg/*.dmg
            app/src-tauri/target/release/bundle/macos/*.app
          retention-days: 7
          if-no-files-found: warn

      - name: Smoke test - Verify app bundle
        # Each exit 1 below is annotated: these logs are unreachable (403), so
        # an unannotated failure here is undiagnosable.
        run: |
          APP_BUNDLE="app/src-tauri/target/release/bundle/macos/OPEN MUSIC.app"
          if [ -d "$APP_BUNDLE" ]; then
            echo "✓ App bundle exists"
            # Verify app structure
            if [ -f "$APP_BUNDLE/Contents/Info.plist" ]; then
              echo "✓ Info.plist found"
            else
              echo "✗ Info.plist missing"
              echo "::error title=app bundle smoke test (macOS)::Info.plist missing inside $APP_BUNDLE/Contents"
              exit 1
            fi
            if [ -f "$APP_BUNDLE/Contents/MacOS/trance-music" ]; then
              echo "✓ Binary exists"
              # Check if binary is executable
              if [ -x "$APP_BUNDLE/Contents/MacOS/trance-music" ]; then
                echo "✓ Binary is executable"
              else
                echo "⚠ Binary is not executable (may need code signing)"
              fi
            else
              echo "✗ Binary not found"
              echo "::error title=app bundle smoke test (macOS)::Contents/MacOS/trance-music missing inside $APP_BUNDLE"
              exit 1
            fi
          else
            echo "✗ App bundle not found"
            echo "::error title=app bundle smoke test (macOS)::bundle not found at $APP_BUNDLE"
            exit 1
          fi

      - name: Verify DMG mounts and app launches
        # Structure checks only prove files exist. This proves the artifact
        # runs: mount the disk image, launch the binary, assert it survives.
        run: |
          set -uo pipefail
          APP_BUNDLE="app/src-tauri/target/release/bundle/macos/OPEN MUSIC.app"
          BIN="$APP_BUNDLE/Contents/MacOS/trance-music"
          DMG=$(ls app/src-tauri/target/release/bundle/dmg/*.dmg 2>/dev/null | head -1)
          MOUNT=/tmp/dmg-verify
          FAIL=0

          # 1. DMG must mount and contain the app (the literal "does it open")
          # Annotations, not log lines, are the only output channel readable
          # from outside this repo (job logs 403). The run being green already
          # proves mount+launch succeeded -- but ONLY if a DMG existed, so the
          # "no DMG" branch must announce itself or green stays ambiguous.
          if [ -n "$DMG" ]; then
            mkdir -p "$MOUNT"
            if hdiutil attach -nobrowse -readonly -mountpoint "$MOUNT" "$DMG" >/dev/null 2>&1; then
              echo "✓ DMG mounted"
              if [ -d "$MOUNT/OPEN MUSIC.app" ]; then
                echo "✓ OPEN MUSIC.app present inside the DMG"
                # Notice emitted only AFTER the check it describes. Emitting
                # it earlier would let a success annotation coexist with a
                # failure annotation for the same fact.
                echo "::notice title=DMG verification::mounted and found OPEN MUSIC.app inside — $(basename "$DMG")"
              else
                echo "✗ OPEN MUSIC.app missing from the DMG"; FAIL=1
                echo "::error title=DMG verification (macOS)::DMG mounted but OPEN MUSIC.app is not inside it: $(basename "$DMG")"
                ls -la "$MOUNT" || true
              fi
              hdiutil detach "$MOUNT" -force >/dev/null 2>&1 || true
            else
              echo "✗ hdiutil attach failed — the DMG is not mountable"; FAIL=1
              echo "::error title=DMG verification (macOS)::hdiutil attach failed, DMG is not mountable: $(basename "$DMG")"
            fi
          else
            echo "⚠ No DMG produced; skipping mount check"
            echo "::warning title=No DMG produced::bundle/dmg/*.dmg absent, so the mount check was skipped and this run does NOT prove the image opens"
          fi

          # 2. The binary must survive launch (catches dyld / @rpath faults)
          if [ -x "$BIN" ]; then
            echo "Launching $BIN"
            "$BIN" >/tmp/app-launch.log 2>&1 &
            APP_PID=$!
            sleep 12
            if kill -0 "$APP_PID" 2>/dev/null; then
              echo "✓ App still running after 12s (pid $APP_PID)"
              echo "::notice title=App launch verification::binary alive after 12s (pid $APP_PID) — dyld/rpath OK"
              kill "$APP_PID" 2>/dev/null || true
              sleep 2
              kill -9 "$APP_PID" 2>/dev/null || true
            else
              echo "✗ App exited early — launch failed"
              echo "--- launch log ---"; cat /tmp/app-launch.log || true
              FAIL=1
              # dyld and @rpath faults print to this log; carry them into the
              # annotation because the log itself is unreachable (403).
              echo "::error title=App launch (macOS)::binary exited within 12s: $(tail -c 800 /tmp/app-launch.log | tr '\n' ' ')"
            fi
          else
            echo "✗ Binary not executable"; FAIL=1
            echo "::error title=App launch (macOS)::binary missing or not executable: $BIN"
          fi

          # 3. Codesign: ADVISORY only. An unsigned CI build is expected to
          #    fail Gatekeeper — this diagnoses, it does not gate.
          codesign --verify --deep --strict "$APP_BUNDLE" \
            && echo "✓ codesign verify passed" \
            || echo "⚠ codesign: not signed or signature invalid (expected on an unsigned CI build)"
          spctl -a -vv -t exec "$APP_BUNDLE" \
            && echo "✓ Gatekeeper assessment passed" \
            || echo "⚠ Gatekeeper rejected it (expected without notarisation — this is why a Mac reports 'damaged')"

          # 4. CI-built bundles must not carry a quarantine flag
          if xattr -p com.apple.quarantine "$APP_BUNDLE" >/dev/null 2>&1; then
            echo "⚠ quarantine xattr present"
          else
            echo "✓ no quarantine xattr"
          fi

          exit $FAIL

      - name: Create build summary
        run: |
          echo "## macOS Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Build completed successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -lh app/src-tauri/target/release/bundle/macos/ 2>/dev/null || echo "No bundle directory"
          ls -lh app/src-tauri/target/release/bundle/dmg/ 2>/dev/null || echo "No DMG"
          echo '```' >> $GITHUB_STEP_SUMMARY
