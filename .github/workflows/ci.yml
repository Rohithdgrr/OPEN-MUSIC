name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  matrix-test:
    name: Test & Build Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            patchelf \
            libssl-dev \
            build-essential

      - name: Install macOS system dependencies
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3 || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Lint frontend JavaScript
        working-directory: app
        run: npm run lint

      - name: Run frontend unit tests (Node test runner)
        working-directory: app
        run: npm test

      - name: Syntax check all JS modules
        working-directory: app
        shell: bash
        run: |
          for f in src/*.js; do node --check "$f"; done
          for f in src/mobile/*.js; do node --check "$f"; done

      - name: Build CSS stylesheet
        working-directory: app
        run: npm run css

      - name: Cargo Format Check
        if: runner.os == 'Windows'
        working-directory: app/src-tauri
        run: cargo fmt --check

      - name: Cargo Clippy
        working-directory: app/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Cargo Unit Tests
        working-directory: app/src-tauri
        run: cargo test
        env:
          OP_OFFLINE: "1"

  ios-validation:
    name: iOS Target Compilation Check (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain & iOS targets
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          # The action's input is `target` (comma-separated). It accepts a
          # misspelled `targets:` without failing and only warns, which left
          # aarch64-apple-ios-sim uninstalled and broke `cargo check` below
          # with E0463 (can't find crate for `std`).
          target: aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Build CSS stylesheet
        working-directory: app
        run: npm run css

      - name: Check Rust Compilation for iOS Simulator
        working-directory: app/src-tauri
        run: cargo check --target aarch64-apple-ios-sim --lib

  security-audit:
    name: Security & Audit Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit --ignore RUSTSEC-2020-0071 || true
