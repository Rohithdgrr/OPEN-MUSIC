name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  matrix-test:
    name: Test & Build Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            patchelf \
            libssl-dev \
            build-essential

      # ~488 crates compile on a cold runner; keep cargo's registry + target
      # dir warm across runs, keyed by Cargo.lock. (~10 min saved per run.)
      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Lint frontend JavaScript
        working-directory: app
        run: npm run lint

      - name: Run frontend unit tests (Node test runner)
        working-directory: app
        run: npm test

      - name: Syntax check all JS modules
        working-directory: app
        shell: bash
        run: |
          for f in src/*.js; do node --check "$f"; done
          for f in src/mobile/*.js; do node --check "$f"; done

      - name: Build CSS stylesheet
        working-directory: app
        run: npm run css

      - name: Cargo Format Check
        if: runner.os == 'Windows'
        working-directory: app/src-tauri
        run: cargo fmt --check

      - name: Cargo Clippy
        working-directory: app/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Cargo Unit Tests
        working-directory: app/src-tauri
        run: cargo test
        env:
          OP_OFFLINE: "1"

  security-audit:
    name: Security & Audit Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@cargo-audit
      # Blocking since 2026-10-15: a vulnerability in the lock fails the run.
      # Warnings (unmaintained / unsound / yanked upstreams) are listed but do
      # not fail -- the current four are tracked in docs/security-posture.md.
      # The old `--ignore RUSTSEC-2020-0071 || true` was removed: the advisory
      # no longer matches any locked crate, and `|| true` made the gate unable
      # to fail (same class as the pipefail lesson in docs/cross-platform-ci.md).
      # Proof it works: on its first local run the gate caught four fresh
      # rustls advisories (RUSTSEC-2026-0346..0349) -- fixed by locking
      # rustls 0.23.46.
      - name: cargo audit (blocking)
        run: cargo audit
